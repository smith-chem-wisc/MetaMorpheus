name: Install and Run

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_FRAMEWORK: net10.0

jobs:
  install:
    name: Create Installer Artifact
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        run: dotnet restore ./MetaMorpheus/MetaMorpheus.sln

      - name: Build solution
        run: dotnet msbuild -v:minimal -p:Configuration=Release -p:UseSharedCompilation=false ./MetaMorpheus/

      - name: Build installer
        run: |
          msbuild ./MetaMorpheus/MetaMorpheusSetup/MetaMorpheusSetup.wixproj /p:Configuration=Release /verbosity=minimal /p:UseSharedCompilation=false
          msbuild ./MetaMorpheus/Bootstrapper/Bootstrapper.wixproj /p:Configuration=Release /p:UseSharedCompilation=false

      - name: Verify installer exists
        run: |
          if (!(Test-Path "./MetaMorpheus/MetaMorpheusSetup/bin/Release/MetaMorpheusInstaller.msi")) {
            Write-Host "❌ Installer build failed: MetaMorpheusInstaller.msi not found." -ForegroundColor Red
            exit 1
          }

      - name: Zip command-line version
        run: |
          7z a MetaMorpheus_CommandLine.zip .\MetaMorpheus\CMD\bin\Release\$env:DOTNET_FRAMEWORK\* "-x!*.xml"

      # check that installer is greater than 1 kb to avoid pushing an empty artifact
      - name: Validate command-line zip artifact
        run: |
          if ((Get-Item MetaMorpheus_CommandLine.zip).length -lt 1kb) {
            Write-Host "❌ The build failed because the command-line .zip did not build properly; it is empty." -ForegroundColor Red
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaMorpheusInstaller
          path: ./MetaMorpheus/MetaMorpheusSetup/bin/Release/MetaMorpheusInstaller.msi

      - name: Upload command-line zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaMorpheus_CommandLine
          path: MetaMorpheus_CommandLine.zip


  test_installer:
    name: Search with Installed
    runs-on: windows-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MetaMorpheusInstaller

      - name: Install MetaMorpheus MSI
        run: |
          Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$(Get-Location)\MetaMorpheusInstaller.msi`" /qn /l*v install.log" -Wait


      - name: Display workspace directory tree
        run: |
          function Show-Tree ($path, $indent = "") {
              Get-ChildItem -LiteralPath $path | ForEach-Object {
                  Write-Host "$indent|- $($_.Name)"
                  if ($_.PSIsContainer) {
                      Show-Tree -path $_.FullName -indent ("$indent   ")
                  }
              }
          }
          $workspace = Get-Location
          Write-Host "Workspace directory tree for: $workspace"
          Show-Tree $workspace

      - name: Microvinette with installed CMD.exe
        run: |
          $dataDir = "$(Get-Location)\MetaMorpheus\MetaMorpheus\Test\TestData"
          & "C:\Program Files\MetaMorpheus\CMD.exe" --test -o "$dataDir\exe_output" -v minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ CMD.exe search failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      - name: Generate Default TOMLs with installed CMD.dll
        run: |
          dotnet "C:\Program Files\MetaMorpheus\CMD.dll" -g -o "$(Get-Location)\MetaMorpheus\EngineLayer\Data"

      - name: Run search with installed CMD.dll
        run: |
          $dataDir = "$(Get-Location)\MetaMorpheus\EngineLayer\Data"
          dotnet "C:\Program Files\MetaMorpheus\CMD.dll" -s "$dataDir\SmallCalibratible_Yeast.mzML" -d "$dataDir\SmallYeast.fasta" -t "$dataDir\SearchTask.toml" -o "$dataDir\dll_output" -v minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ CMD.dll search failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      # Top-down is the only path that reaches the ProForma writer: the column is gated on
      # AnalyteType.Proteoform, so every bottom-up search above skips ToProFormaString() entirely.
      # A dependency needed only by that path can pass all of the above and still crash a real
      # top-down run. The assertion script requires actual proteoform rows, because a search that
      # finds nothing would leave the writer untested while still exiting 0.
      - name: Run top-down search with installed CMD.dll
        run: |
          $tdDir = "$(Get-Location)\MetaMorpheus\Test\TopDownTestData"
          $tdOut = "$(Get-Location)\MetaMorpheus\EngineLayer\Data\td_dll_output"
          dotnet "C:\Program Files\MetaMorpheus\CMD.dll" -s "$tdDir\slicedTDYeast.mzML" -d "$tdDir\CYB5_YEAST_P40312.fasta" -t "$tdDir\TopDownSearchToml.toml" -o "$tdOut" -v minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Top-down search with installed CMD.dll failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }
          & "$(Get-Location)\.github\scripts\Assert-TopDownProFormaOutput.ps1" -SearchOutput $tdOut

  test_build:
    name: Search with Built
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ./MetaMorpheus/MetaMorpheus.sln

      - name: Build solution
        run: dotnet msbuild -v:minimal -p:Configuration=Release -p:UseSharedCompilation=false ./MetaMorpheus/

      - name: Generate Default TOMLs
        run: |
          dotnet "$(Get-Location)\MetaMorpheus\CMD\bin\Release\$env:DOTNET_FRAMEWORK\CMD.dll" -g -o "$(Get-Location)\MetaMorpheus\CMD\bin\Release\$env:DOTNET_FRAMEWORK\Data"

      - name: Run search with built CMD.dll
        run: |
          $dataDir = "$(Get-Location)\MetaMorpheus\CMD\bin\Release\$env:DOTNET_FRAMEWORK\Data"
          dotnet "$(Get-Location)\MetaMorpheus\CMD\bin\Release\$env:DOTNET_FRAMEWORK\CMD.dll" -s "$dataDir\SmallCalibratible_Yeast.mzML" -d "$dataDir\SmallYeast.fasta" -t "$dataDir\SearchTask.toml" -o "$dataDir\built_dll_output" -v minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Built CMD.dll search failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }

      # See the note on the installed-CMD top-down step above: bottom-up never exercises the
      # ProForma writer, so this is the only smoke search that would catch a break in it.
      - name: Run top-down search with built CMD.dll
        run: |
          $tdDir = "$(Get-Location)\MetaMorpheus\Test\TopDownTestData"
          $tdOut = "$(Get-Location)\MetaMorpheus\CMD\bin\Release\$env:DOTNET_FRAMEWORK\Data\td_built_output"
          dotnet "$(Get-Location)\MetaMorpheus\CMD\bin\Release\$env:DOTNET_FRAMEWORK\CMD.dll" -s "$tdDir\slicedTDYeast.mzML" -d "$tdDir\CYB5_YEAST_P40312.fasta" -t "$tdDir\TopDownSearchToml.toml" -o "$tdOut" -v minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Top-down search with built CMD.dll failed with exit code $LASTEXITCODE" -ForegroundColor Red
            exit $LASTEXITCODE
          }
          & "$(Get-Location)\.github\scripts\Assert-TopDownProFormaOutput.ps1" -SearchOutput $tdOut

  ## Installs and builds. Verifies that the same dlls exist
  validate_installer_contents:
    name: Validate Installer Contents
    runs-on: windows-latest
    needs: install

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MetaMorpheusInstaller

      - name: Install MetaMorpheus MSI
        run: |
          Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$(Get-Location)\MetaMorpheusInstaller.msi`" /qn /l*v install.log" -Wait

      - name: Restore dependencies
        run: dotnet restore ./MetaMorpheus/MetaMorpheus.sln

      - name: Build solution
        run: dotnet msbuild -v:minimal -p:Configuration=Release -p:UseSharedCompilation=false ./MetaMorpheus/

      # Compares the DLLs in the build output against the DLLs the MSI installed, at two
      # levels at once: the top-level assembly folder and the win-x64 native runtime folder
      # (runtimes\win-x64\native). The native folder holds libraries loaded via DllImport at
      # runtime (LibTorchSharp.dll, torch_cpu.dll, libSkiaSharp.dll, ...) that throw
      # DllNotFoundException when the installer omits them; a plain top-level scan never saw
      # them. Both levels share one whitelist, one folder list, and one diff below.
      #
      # Native coverage is scoped to win-x64 on purpose: the MSI is a Windows x64 installer,
      # and it deliberately maps the other RIDs' native folders to non-standard names
      # (runtimes\linux-x64\nativeLinux, runtimes\osx-x64\nativeOsx - see the Directory
      # elements in MetaMorpheus/MetaMorpheusSetup/Product.wxs). Only win-x64 keeps the real
      # "native" folder name, so only file names within that one folder are compared; a
      # blanket recursive relative-path diff would report the renamed folders as false
      # mismatches.
      - name: Compare built DLLs to installed DLLs
        run: |
          $installDir = "C:\Program Files\MetaMorpheus"

          # Relative subpaths compared under both the build output folders and the install
          # directory. "" is the top-level assembly folder. Each file is keyed by its
          # relative path (subpath\name, or just name at the top level), so a top-level DLL
          # and a native DLL of the same name never collide, and each is diffed against the
          # matching install location.
          $subPathsToCheck = @(
              "",
              "runtimes\win-x64\native"
          )

          # Define whitelist for missing DLLs (build-only) - Okay to not be installed.
          # Entries are keyed the same way as the comparison: top-level names are bare, and a
          # native would be listed as runtimes\win-x64\native\<name>.
          $whitelistedMissing = @(
            "System.Configuration.ConfigurationManager.dll",
            "System.Security.Cryptography.ProtectedData.dll",
            # Same EntityFramework 4.7.0 chain as the two below, and it reaches the build only
            # through mzLib's nuspec. Installing it would ship a 2019 binary in place of the
            # 8.0.0.0 the MSI used to carry; smith-chem-wisc/mzLib#1142 removes it at source.
            "System.Drawing.Common.dll",
            "System.Security.Permissions.dll",
            "System.Windows.Extensions.dll",
            # The EF6 chain itself, no longer shipped in the MSI. Nothing in MetaMorpheus uses
            # EntityFramework, and #2710 dropped the System.Data.SQLite metapackage that was its
            # only direct source; it now reaches the build only transitively, through mzLib
            # 1.0.584, whose published nuspec predates smith-chem-wisc/mzLib#1142. These four
            # entries become dead and should be swept when MetaMorpheus moves to a post-#1142
            # mzLib. sni.dll rides the same chain but lives in runtimes\win-x64\native\, which
            # the native scan below now covers -- it would need an entry keyed as
            # runtimes\win-x64\native\sni.dll only if #2690 lands.
            "EntityFramework.dll",
            "EntityFramework.SqlServer.dll",
            "System.Data.SqlClient.dll",
            "System.Data.SQLite.EF6.dll",
            # Thermo's MassPrecisionEstimator is stamped AMD64 in its PE header, so an arm64
            # runtime refuses to load it; nothing in MetaMorpheus or mzLib uses it, and
            # smith-chem-wisc/mzLib#1156 stops referencing and shipping it. It still reaches the
            # build through mzLib 1.0.584, whose published nuspec predates that PR, so it is in
            # the build output while no longer being installed. This entry becomes dead and
            # should be swept when MetaMorpheus moves to a post-#1156 mzLib.
            "ThermoFisher.CommonCore.MassPrecisionEstimator.dll",
            "Microsoft.Win32.SystemEvents.dll",
            "Microsoft.Extensions.DependencyInjection.Abstractions.dll",
            "Microsoft.Extensions.DependencyInjection.dll",
            "Microsoft.Extensions.Logging.Abstractions.dll",
            "Microsoft.Extensions.Logging.dll",
            "Microsoft.Extensions.Options.dll",
            "Microsoft.Extensions.Primitives.dll"
          )

          # Define whitelist for extra DLLs (install-only), keyed the same way
          $whitelistedExtra = @(

          )

          # Define which build output folders to check in the repo
          $foldersToCheck = @(
              "$(Get-Location)\MetaMorpheus\EngineLayer\bin\Release\$env:DOTNET_FRAMEWORK",
              "$(Get-Location)\MetaMorpheus\CMD\bin\Release\$env:DOTNET_FRAMEWORK",
              "$(Get-Location)\MetaMorpheus\TaskLayer\bin\Release\$env:DOTNET_FRAMEWORK",
              "$(Get-Location)\MetaMorpheus\GUI\bin\Release\$env:DOTNET_FRAMEWORK-windows",
              "$(Get-Location)\MetaMorpheus\GuiFunctions\bin\Release\$env:DOTNET_FRAMEWORK-windows"
          )

          # A folder that is not there means this list has drifted from where the projects
          # actually build, and the check quietly covers less than it claims. GuiFunctions was
          # in that state: it targets net<n>.0-windows but was looked for under net<n>.0, so
          # nothing it produces was ever validated.
          $missingFolders = $foldersToCheck | Where-Object { -not (Test-Path $_) }
          if ($missingFolders) {
              Write-Host "::error::Build folders not found, so this check would be incomplete:"
              $missingFolders | ForEach-Object { Write-Host "  - $_" }
              exit 1
          }

          # Collect build DLLs keyed by relative path, remembering where each was found
          $buildDlls = @()
          $buildDllLocations = @{}
          foreach ($folder in $foldersToCheck) {
              foreach ($subPath in $subPathsToCheck) {
                  $searchFolder = if ($subPath) { Join-Path $folder $subPath } else { $folder }
                  if (Test-Path $searchFolder) {
                      Get-ChildItem -Path $searchFolder -Filter *.dll | ForEach-Object {
                          $key = if ($subPath) { Join-Path $subPath $_.Name } else { $_.Name }
                          $buildDlls += $key
                          $buildDllLocations[$key] = $searchFolder
                      }
                  }
              }
          }
          $buildDlls = @($buildDlls | Sort-Object -Unique)

          # Guard against a silent pass if a build output layout ever moves: every subpath we
          # claim to cover must actually contribute at least one file, or the comparison for
          # that level would trivially "match" nothing.
          foreach ($subPath in $subPathsToCheck) {
              $foundForSubPath = if ($subPath) {
                  $buildDlls | Where-Object { $_ -like "$subPath\*" }
              } else {
                  $buildDlls | Where-Object { $_ -notlike "*\*" }
              }
              if (-not $foundForSubPath) {
                  $label = if ($subPath) { $subPath } else { "the top-level output folder" }
                  Write-Host "❌ No DLLs found for $label in any build output folder; the comparison cannot be trusted." -ForegroundColor Red
                  $foldersToCheck | ForEach-Object {
                      $where = if ($subPath) { Join-Path $_ $subPath } else { $_ }
                      Write-Host "- looked in $where"
                  }
                  exit 1
              }
          }

          # Collect installed DLLs keyed the same way
          $installedDlls = @()
          foreach ($subPath in $subPathsToCheck) {
              $searchFolder = if ($subPath) { Join-Path $installDir $subPath } else { $installDir }
              if (Test-Path $searchFolder) {
                  Get-ChildItem -Path $searchFolder -Filter *.dll | ForEach-Object {
                      $installedDlls += if ($subPath) { Join-Path $subPath $_.Name } else { $_.Name }
                  }
              }
          }
          $installedDlls = @($installedDlls | Sort-Object -Unique)

          # Find missing DLLs (in build, not in install), ignoring whitelist
          $missingDlls = @($buildDlls | Where-Object { $_ -notin $installedDlls -and $_ -notin $whitelistedMissing })

          # Find extra DLLs (in install, not in build), ignoring whitelist
          $extraDlls = @($installedDlls | Where-Object { $_ -notin $buildDlls -and $_ -notin $whitelistedExtra })

          $hasError = $false

          if ($missingDlls.Count -gt 0) {
              Write-Host "❌ Missing DLLs from installer (not whitelisted):" -ForegroundColor Red
              $missingDlls | ForEach-Object {
                  $sourceFolder = $buildDllLocations[$_]
                  Write-Host "- $_ (from $sourceFolder)"
              }
              if ($missingDlls | Where-Object { $_ -like "runtimes\win-x64\native\*" }) {
                  Write-Host "Native libraries under runtimes\win-x64\native are loaded by DllImport at runtime; when absent the installed app throws DllNotFoundException."
                  Write-Host "Add missing natives to the WinNativeMathComponents ComponentGroup in MetaMorpheus/MetaMorpheusSetup/Product.wxs."
              }
              $hasError = $true
          }

          if ($extraDlls.Count -gt 0) {
              Write-Host "❌ Extra/unexpected DLLs in installer:" -ForegroundColor Red
              $extraDlls | ForEach-Object { Write-Host "- $_" }
              $hasError = $true
          }

          if ($hasError) {
              exit 1
          } else {
              Write-Host "✅ Installer DLLs match build output exactly (top-level and runtimes\win-x64\native)." -ForegroundColor Green
          }

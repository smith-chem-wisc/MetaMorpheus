name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_FRAMEWORK: net10.0

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore ./MetaMorpheus/MetaMorpheus.sln
        
      - name: Build
        run: dotnet build --no-restore ./MetaMorpheus/MetaMorpheus.sln --configuration Release
        
      - name: Install Coverlet for code coverage
        run: dotnet add ./MetaMorpheus/Test/Test.csproj package coverlet.collector -v 6.0.2
        
      - name: Run unit tests with coverage
        # Exclude live external-service tests (UniProt, etc.) from the required run; they run in the
        # separate, non-blocking external-service-tests job below.
        run: dotnet test .\MetaMorpheus\Test\Test.csproj --configuration Release --verbosity normal --filter "Category!=ExternalService" --collect:"XPlat Code Coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: unittests

  # The half of the GUI tests that do not need WPF, run on all three platforms. Test.csproj is
  # net10.0-windows and can only run on Windows; these are the same test files compiled into a net10.0
  # project, so they are the same tests rather than copies of them.
  guifunctions-core-tests:
    name: GuiFunctions.Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run GuiFunctions.Core tests with coverage
        # Same exclusion as the Windows unittests job: this project globs Test/GuiTests, so a live
        # external-service test added there would otherwise join this run and let a third party's
        # outage redden three platforms at once.
        run: dotnet test ./MetaMorpheus/GuiFunctions.Core.Tests/GuiFunctions.Core.Tests.csproj --configuration Release --verbosity normal --filter "Category!=ExternalService" --collect:"XPlat Code Coverage"

      # Its own flag, so this is not confused with the Windows-only unittests run that covers the same
      # source through Test.csproj.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: guifunctionscore

  # Runs tests that depend on live external web services (UniProt, ...). Kept separate and
  # intentionally NOT a required status check, so a third-party outage never blocks a PR. The tests
  # self-classify: an outage is reported as Skipped (Assert.Ignore) and only a genuine contract
  # break fails this job. Do NOT add this job to branch-protection required checks.
  external-service-tests:
    name: External-service tests (non-blocking)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore ./MetaMorpheus/MetaMorpheus.sln

      - name: Build
        run: dotnet build --no-restore ./MetaMorpheus/MetaMorpheus.sln --configuration Release

      - name: Run external-service tests
        run: dotnet test .\MetaMorpheus\Test\Test.csproj --configuration Release --no-build --verbosity normal --filter "Category=ExternalService"

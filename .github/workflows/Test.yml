name: Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_FRAMEWORK: net10.0

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore ./MetaMorpheus/MetaMorpheus.sln
        
      - name: Build
        run: dotnet build --no-restore ./MetaMorpheus/MetaMorpheus.sln --configuration Release
        
      - name: Install Coverlet for code coverage
        run: dotnet add ./MetaMorpheus/Test/Test.csproj package coverlet.collector -v 6.0.2
        
      - name: Run unit tests with coverage
        # Exclude live external-service tests (UniProt, etc.) from the required run; they run in the
        # separate, non-blocking external-service-tests job below.
        run: dotnet test .\MetaMorpheus\Test\Test.csproj --configuration Release --verbosity normal --filter "Category!=ExternalService" --collect:"XPlat Code Coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: unittests

  # The Avalonia GUI tests, run on all three platforms. Test.csproj targets net10.0-windows and so can
  # only run here on Windows; these are net10.0 and headless, which is the point of them.
  avalonia-gui-tests:
    name: Avalonia GUI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Expresses "do not hang forever" here rather than as a wall-clock assertion inside a test, so a
    # slow runner fails the job for what it is instead of looking like a broken search. The suite runs
    # in well under a minute.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run Avalonia GUI tests with coverage
        run: dotnet test ./MetaMorpheus/GUI.Avalonia.Tests/GUI.Avalonia.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      # Without this the new code sits outside the coverage denominator, which is why Codecov reported a
      # zero-line delta on a four-thousand-line pull request. A separate flag keeps it from being
      # confused with the Windows-only unittests run.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: avaloniagui

  # Runs tests that depend on live external web services (UniProt, ...). Kept separate and
  # intentionally NOT a required status check, so a third-party outage never blocks a PR. The tests
  # self-classify: an outage is reported as Skipped (Assert.Ignore) and only a genuine contract
  # break fails this job. Do NOT add this job to branch-protection required checks.
  external-service-tests:
    name: External-service tests (non-blocking)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore dependencies
        run: dotnet restore ./MetaMorpheus/MetaMorpheus.sln

      - name: Build
        run: dotnet build --no-restore ./MetaMorpheus/MetaMorpheus.sln --configuration Release

      - name: Run external-service tests
        run: dotnet test .\MetaMorpheus\Test\Test.csproj --configuration Release --no-build --verbosity normal --filter "Category=ExternalService"
